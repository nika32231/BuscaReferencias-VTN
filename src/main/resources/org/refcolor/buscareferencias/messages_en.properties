# ── Tutorial steps ────────────────────────────────────────────────────────────
tutorial.welcome.title=Welcome!
tutorial.welcome.body=Find reference photos for your poses instantly.
tutorial.palette.title=Body palette
tutorial.palette.body=Select the body part you want to draw.\nEach one has its own color.
tutorial.canvas.title=Draw the pose
tutorial.canvas.body=Trace simple lines on the canvas.\nPrecision doesn't matter — just the shape!
tutorial.tools.title=Tools
tutorial.tools.body=Draw, erase and undo strokes.\nDrag the bottom corner to resize.
tutorial.search.title=Search references
tutorial.search.body=Analyze your pose and find the most\nsimilar photos in your library.
tutorial.library.title=Your library
tutorial.library.body=Add your own reference photos.\nThey are saved directly to the folder.
tutorial.gallery.title=Results
tutorial.gallery.body=Photos sorted by similarity.\nClick any to open it.
tutorial.finish.title=All set!
tutorial.finish.body=Draw a pose and press 🔍 Search photos.\nPress ❓ to see this tutorial again.
