# Flags por defecto (seguro)
# Puedes sobreescribir con:
#  -Dapp.safeMode=false
# o variables de entorno:
#  APP_APP_SAFEMODE=false

app.safeMode=false
ui.forceFallback=false

features.dbInitOnStartup=false
features.depsCheckOnStartup=true

features.playwright.enabled=true
features.onlineSearch.enabled=true
features.mediapipe.debug=false

# Ruta manual opcional para Python en Windows.
# Ejemplos:
# python.path=C:/Python311/python.exe
# o env PYTHON_PATH=C:\Python311\python.exe
python.path=

# Backend web h?brido (futuro). No afecta el arranque actual.
# Activa el backend h?brido: el cliente Java enviar? peticiones al backend REST.
# Si el backend no responde, el cliente volver? al pipeline local autom?ticamente.
backend.enabled=true
backend.baseUrl=http://127.0.0.1:8000
backend.requestTimeoutSeconds=120


# Pexels API key (NO colocar aquí la clave en repositorios públicos).
# Preferible: definir en variables de entorno PEXELS_API_KEY o APP_PEXELS_API_KEY
# Alternativa: agregar localmente (no versionar) en este archivo la propiedad:
# pexels.apiKey=YOUR_PEXELS_API_KEY


