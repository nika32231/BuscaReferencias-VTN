# Flags por defecto (seguro)
# Puedes sobreescribir con:
#  -Dapp.safeMode=false
# o variables de entorno:
#  APP_APP_SAFEMODE=false

app.safeMode=false
ui.forceFallback=false

features.dbInitOnStartup=false
features.depsCheckOnStartup=true

features.mediapipe.debug=false

# Ruta manual opcional para Python en Windows.
# Ejemplos:
# python.path=C:/Python311/python.exe
# o env PYTHON_PATH=C:\Python311\python.exe
python.path=

# Búsqueda local de referencias (poses similares, no exactas)
search.local.dir=cache/thumbnails
search.min.results=5
search.max.results=10
search.analysis.limit=400
search.min.score=0.0

# Tolerancia de posición por parte del cuerpo (mayor = más permisivo)
tolerance.skeleton.default=2.5
tolerance.skeleton.head=2.5
tolerance.skeleton.arms=3.0
tolerance.skeleton.forearms=3.0
tolerance.skeleton.hands=3.5
tolerance.skeleton.thighs=2.8
tolerance.skeleton.calves=2.8
tolerance.skeleton.feet=3.0

# Tolerancia de ángulos en grados (mayor = más permisivo)
tolerance.angle.arm=360
tolerance.angle.leg=360

