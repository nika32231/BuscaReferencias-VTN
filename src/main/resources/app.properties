# Flags por defecto (seguro)
# Puedes sobreescribir con:
#  -Dapp.safeMode=false
# o variables de entorno:
#  APP_APP_SAFEMODE=false

app.safeMode=false
ui.forceFallback=false

features.dbInitOnStartup=true
features.depsCheckOnStartup=true

features.mediapipe.debug=false

# Ruta manual opcional para Python en Windows.
# Ejemplos:
# python.path=C:/Python311/python.exe
# o env PYTHON_PATH=C:\Python311\python.exe
python.path=

# Búsqueda local de referencias (poses similares, no exactas)
search.local.dir=cache/thumbnails
search.min.results=5
search.max.results=10
search.analysis.limit=100
# Solo mostrar imágenes con ≥40% de similitud (si hay <5 por encima se muestra el top-5 igual)
search.min.score=0.40

# Tolerancia de posición por parte del cuerpo (mayor = más permisivo).
# Valores reducidos respecto a la versión anterior para crear mejor discriminación
# entre poses que sí coinciden con el dibujo y poses que no.
tolerance.skeleton.default=2.0
tolerance.skeleton.head=2.0
tolerance.skeleton.arms=2.0
tolerance.skeleton.forearms=2.0
tolerance.skeleton.hands=2.2
tolerance.skeleton.thighs=2.0
tolerance.skeleton.calves=2.0
tolerance.skeleton.feet=2.0

# Tolerancia de ángulos en grados (mayor = más permisivo).
# ANTES era 360° → cualquier ángulo daba puntuación parecida → todos los resultados
# aparecían con 61-64% sin discriminar posturas. Con 60° una diferencia de 60°
# ya puntúa 0, creando una dispersión real de puntuaciones.
tolerance.angle.arm=60
tolerance.angle.leg=60

