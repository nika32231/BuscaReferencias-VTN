name: Web Transition Readiness (manual)

on:
  workflow_dispatch:

jobs:
  jpro-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify desktop build is healthy
        run: ./mvnw -B -DskipTests clean package

      - name: Web transition summary
        run: |
          echo "Desktop JavaFX build OK." >> $GITHUB_STEP_SUMMARY
          echo "La web real del proyecto vive en docs/ y consume el backend FastAPI existente." >> $GITHUB_STEP_SUMMARY
          echo "JPro puede evaluarse como vía adicional para reutilizar FXML/controllers, pero no reemplaza Python/MediaPipe/Playwright." >> $GITHUB_STEP_SUMMARY
          echo "Arquitectura objetivo: GitHub Pages -> backend REST -> motor Python." >> $GITHUB_STEP_SUMMARY

